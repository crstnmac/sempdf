server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # VitePress `cleanUrls: true` emits extensionless links (/guide/getting-started)
    # while build output is getting-started.html. Resolve the .html fallback,
    # then directory index, then 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long-cache fingerprinted assets; never cache HTML so deploys go live.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
