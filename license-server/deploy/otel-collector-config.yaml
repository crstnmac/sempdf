# OTel Collector (contrib) — runs on each instance, ships to self-hosted SigNoz.
#   metrics: scrapes the api's Prometheus /metrics over the docker network
#   logs:    tails all docker container json logs on the host
# Endpoint comes from .env (SIGNOZ_OTLP_ENDPOINT, gRPC :4317 on the SigNoz host).

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: license-api
          scrape_interval: 30s
          static_configs:
            - targets: ["api:8787"]

  filelog:
    include: [/var/lib/docker/containers/*/*.log]
    start_at: end
    operators:
      # Docker json-file driver: {"log":"...","stream":"stdout","time":"..."}
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      - type: move
        from: attributes.log
        to: body

processors:
  # host.name etc. from OTEL_RESOURCE_ATTRIBUTES (set per host in compose).
  resourcedetection:
    detectors: [env]
  batch: {}

exporters:
  otlp:
    endpoint: ${env:SIGNOZ_OTLP_ENDPOINT}
    tls:
      insecure: ${env:SIGNOZ_OTLP_INSECURE}

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    logs:
      receivers: [filelog]
      processors: [resourcedetection, batch]
      exporters: [otlp]
