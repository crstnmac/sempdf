# Monitoring stack — as deployed it runs ON lic-1 (~/monitoring, no separate
# monitoring server). Loki stores logs, Prometheus stores metrics
# (remote-write from Alloy on each instance), Grafana is the UI for both.
#
#   docker compose up -d
#
# BIND_IP (in .env) pins all listeners to one interface — set it to the
# host's PRIVATE IP when the host also has a public route, so Loki/Prom/
# Grafana are never internet-reachable. Reach Grafana over an SSH tunnel.
name: zeropdf-monitoring

services:
  loki:
    image: grafana/loki:3.7.3
    container_name: monitoring-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${BIND_IP:-0.0.0.0}:3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      # Alloy on the instances pushes metrics here; Prometheus scrapes nothing itself.
      - --web.enable-remote-write-receiver
    ports:
      - "${BIND_IP:-0.0.0.0}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:13.1.0
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${BIND_IP:-0.0.0.0}:3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  loki-data:
  prom-data:
  grafana-data:
