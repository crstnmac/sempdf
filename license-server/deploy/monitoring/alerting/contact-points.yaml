# Contact point for all alerts. Address comes from ALERT_EMAIL in .env
# (compose passes it through); delivery needs GF_SMTP_* set — see compose.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-email
    receivers:
      - uid: ops-email
        type: email
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true
