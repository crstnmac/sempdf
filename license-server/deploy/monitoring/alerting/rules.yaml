# Alert rules from the launch checklist: 5xx rate, sweep wedged, pg pool
# saturation, missing host. Evaluated every 1m; each must hold for `for`
# before firing. Datasource uid must match the provisioned Prometheus.
apiVersion: 1

groups:
  - orgId: 1
    name: license-server
    folder: Alerts
    interval: 1m
    rules:
      - uid: lic-5xx-rate
        title: High 5xx rate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "5xx responses above 0.05/s for 5m (api errors or DB trouble)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: sum(rate(license_responses_total{class="5xx"}[5m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query

      - uid: lic-sweep-stale
        title: Notification sweep wedged
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "license_sweep_age_seconds > 7200 — hourly sweep cron on lic-1 is not completing (/readyz also degrades)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: max(license_sweep_age_seconds)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [7200] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query

      - uid: lic-pool-saturation
        title: PG pool saturated
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Requests waiting on a pg connection for 5m — pool (PG_POOL_MAX) exhausted on {{ $labels.host }}"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: max by(host) (license_pg_pool_connections{state="waiting"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query

      - uid: lic-host-down
        title: API down or host missing
        condition: B
        for: 2m
        # A host that stops reporting entirely produces NO series — treat
        # missing data as firing, that's the "missing host" alert.
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Fewer than 2 healthy hosts — an api is down (up==0) or a host stopped reporting entirely (alloy/instance dead, series went stale)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              # count healthy hosts, not per-host up: a vanished host produces
              # no series at all, which min() would silently ignore.
              expr: count(up{job="license-api"} == 1) or vector(0)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [2] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
