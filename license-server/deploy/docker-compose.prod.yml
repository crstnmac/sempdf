# Production compose — runs on EACH b3-8 instance (api + web pair per host).
# Postgres is the OVH managed cluster (external), never a container here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Requires .env next to this file (see .env.example). REGISTRY + TAG select
# the images pushed by scripts/push.sh.
name: zeropdf-license

services:
  api:
    image: ${REGISTRY}/license-api:${TAG:-latest}
    container_name: zeropdf-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      # OVH managed Postgres signs with a private CA; node-pg verifies the
      # chain (its sslmode=require acts as verify-full), so Node must trust it.
      # Download from the DB service page → place at /opt/zeropdf/ovh-ca.pem.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ovh-ca.pem
    volumes:
      - ./ovh-ca.pem:/etc/ssl/certs/ovh-ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Ships all container logs (→ Loki) + api /metrics (→ Prometheus
  # remote-write) to the monitoring server. See monitoring/ for that stack.
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: zeropdf-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Log tailing + container discovery both go through the docker socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT}
      PROM_ENDPOINT: ${PROM_ENDPOINT}
      # host label tells the two b3-8 instances apart in Grafana.
      HOST_TAG: ${HOST_TAG:-unknown}
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${REGISTRY}/license-web:${TAG:-latest}
    container_name: zeropdf-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8787
    ports:
      # LB backend targets this port on the instance's private IP.
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  # Tail positions — lets alloy resume where it left off across restarts.
  alloy-data:
