# Production compose — runs on EACH b3-8 instance (api + web pair per host).
# Postgres is the OVH managed cluster (external), never a container here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Requires .env next to this file (see .env.example). REGISTRY + TAG select
# the images pushed by scripts/push.sh.
name: sempdf-license

services:
  api:
    image: ${REGISTRY}/license-api:${TAG:-latest}
    container_name: sempdf-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      # OVH managed Postgres signs with a private CA; node-pg verifies the
      # chain (its sslmode=require acts as verify-full), so Node must trust it.
      # Download from the DB service page → place at /opt/sempdf/ovh-ca.pem.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ovh-ca.pem
    volumes:
      - ./ovh-ca.pem:/etc/ssl/certs/ovh-ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Ships api /metrics + all container logs to self-hosted SigNoz (OTLP gRPC).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: sempdf-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      SIGNOZ_OTLP_ENDPOINT: ${SIGNOZ_OTLP_ENDPOINT}
      SIGNOZ_OTLP_INSECURE: ${SIGNOZ_OTLP_INSECURE:-true}
      # host.name tags every metric/log line with which b3-8 it came from.
      OTEL_RESOURCE_ATTRIBUTES: host.name=${HOST_TAG:-unknown},service.namespace=sempdf
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${REGISTRY}/license-web:${TAG:-latest}
    container_name: sempdf-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8787
    ports:
      # LB backend targets this port on the instance's private IP.
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
