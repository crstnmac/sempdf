<!doctype html>
<html lang="en" class="h-full" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>sempdf playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Split columns driven by a CSS var the resizer updates; stacks on small screens. */
      #split {
        grid-template-columns: var(--split, 1fr) 6px 1fr;
      }
      @media (max-width: 720px) {
        #split {
          grid-template-columns: none;
          grid-template-rows: 1fr 1fr;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@sempdf/sempdf-pdf": "/dist/src/index.js",
          "@sempdf/sempdf-pdf/license-guard": "/dist/src/license-guard.js"
        }
      }
    </script>

    <!-- Monaco editor (CDN, AMD). Cross-origin workers are proxied through a data: URL. -->
    <script>
      const MONACO_BASE = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
      window.MonacoEnvironment = {
        getWorkerUrl() {
          return `data:text/javascript;charset=utf-8,${encodeURIComponent(
            `self.MonacoEnvironment={baseUrl:"${MONACO_BASE}/"};importScripts("${MONACO_BASE}/vs/base/worker/workerMain.js");`
          )}`;
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
      require.config({ paths: { vs: `${MONACO_BASE}/vs` } });
      window.monacoReady = new Promise((resolve) => {
        require(["vs/editor/editor.main"], () => resolve(window.monaco));
      });
    </script>
  </head>
  <body class="flex h-full flex-col bg-zinc-900 text-zinc-100 antialiased">
    <header class="flex shrink-0 items-center gap-4 border-b border-zinc-800 bg-zinc-950 px-4 py-2.5">
      <h1 class="text-sm font-semibold">sempdf playground</h1>
      <p class="hidden min-w-0 flex-1 truncate text-xs text-zinc-400 sm:block">
        TypeScript in, PDF out — type-checked and rendered live in your browser as you type.
      </p>
      <label for="sample" class="sr-only">Load sample</label>
      <select
        id="sample"
        class="rounded-md border border-zinc-700 bg-zinc-800 px-2 py-1.5 text-sm text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500"
      ></select>
      <a
        id="download"
        download="sempdf-playground.pdf"
        class="rounded-md px-3 py-1.5 text-sm font-medium text-zinc-300 underline-offset-4 hover:text-zinc-100 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 aria-disabled:pointer-events-none aria-disabled:opacity-40"
        href="#"
        aria-disabled="true"
        >Download PDF</a
      >
    </header>

    <main id="split" class="grid min-h-0 flex-1">
      <!-- Editor -->
      <section class="flex min-h-0 min-w-0 flex-col">
        <h2 class="sr-only">Template code</h2>
        <div id="editor" class="min-h-0 min-w-0 flex-1"></div>
      </section>

      <!-- Resizer -->
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize editor and preview"
        tabindex="0"
        class="cursor-col-resize bg-zinc-800 transition-colors hover:bg-sky-500 focus-visible:bg-sky-500 focus-visible:outline-none max-[720px]:hidden"
      ></div>

      <!-- Preview -->
      <section class="flex min-h-0 min-w-0 flex-col bg-neutral-600">
        <h2 class="sr-only">Rendered PDF</h2>
        <iframe id="preview" title="Rendered PDF" class="min-h-0 min-w-0 flex-1 border-0"></iframe>
      </section>
    </main>

    <footer
      id="status"
      role="status"
      aria-live="polite"
      class="shrink-0 border-t border-zinc-800 bg-zinc-950 px-4 py-2 font-mono text-xs text-zinc-400"
    >
      Loading editor…
    </footer>

    <script type="module" src="/examples/website/playground.js"></script>
  </body>
</html>
